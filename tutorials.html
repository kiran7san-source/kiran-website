<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorials - Kiran Prasad Sankhi</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Load the zero-md web component -->
    <script type="module" src="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js"></script>
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            color: #333;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background-color: #6200ea;
            color: white;
            padding: 24px;
            display: flex;
            align-items: center;
        }
        .header a {
            color: white;
            text-decoration: none;
            display: flex;
            margin-right: 16px;
        }
        .header h1 { margin: 0; font-size: 24px; font-weight: 500; }
        .content { padding: 32px; }
        #back-to-top {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: #6200ea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.06);
            cursor: pointer;
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease, transform 0.2s;
            opacity: 0;
            z-index: 1000;
        }
        #back-to-top.show {
            display: flex;
            opacity: 1;
        }
        #back-to-top:active {
            transform: scale(0.9);
        }
                @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #e0e0e0;
            }
            .card {
                background-color: #1e1e1e;
                box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            }
            .list-item, .link-item {
                color: #e0e0e0;
            }
            .list-item .material-icons {
                color: #9e9e9e;
            }
            .link-item:hover {
                background-color: #2c2c2c;
            }
            .notice {
                background-color: #312311;
                border-left: 4px solid #ff9800;
                color: #e0e0e0;
            }
            #last-updated {
                color: #757575;
            }
        }
    @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #e0e0e0;
            }
            .card {
                background-color: #1e1e1e;
                box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            }
            .list-item, .link-item {
                color: #e0e0e0;
            }
            .list-item .material-icons {
                color: #9e9e9e;
            }
            .link-item:hover {
                background-color: #2c2c2c;
            }
            .notice {
                background-color: #312311;
                border-left: 4px solid #ff9800;
                color: #e0e0e0;
            }
            #last-updated {
                color: #757575;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <a href="index.html" title="Back to Home"><span class="material-icons">arrow_back</span></a>
            <h1>Tutorials</h1>
        </div>
        <div class="content">
            <!-- This tag fetches and renders your markdown file -->
            <zero-md src="tutorials/basic_terminal_guide.md">
                <template>
                    <style>
                        /* Optional styling to match the Material theme */
                        h1, h2, h3 { font-family: 'Roboto', sans-serif; color: #6200ea; }
                        p, li { font-family: 'Roboto', sans-serif; line-height: 1.6; color: #333; }
                        code { background: #f5f5f5; padding: 2px 4px; border-radius: 4px; }
                    </style>
                </template>
            </zero-md>
        </div>
    </div>
    <button id="back-to-top" title="Back to top">
        <span class="material-icons">arrow_upward</span>
    </button>
    <script>
        const backToTopButton = document.getElementById('back-to-top');
    
        // Show button when scrolled down 200px
        window.addEventListener('scroll', () => {
            if (window.scrollY > 200) {
                backToTopButton.classList.add('show');
            } else {
                backToTopButton.classList.remove('show');
            }
        });
    
        // Smooth scroll to top on click
        backToTopButton.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
