<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial Reader | Kiran Prasad Sankhi</title>
  <meta name="description" content="Technical self-hosting, homelab, and Linux tutorials by Kiran Prasad Sankhi.">
  <link rel="canonical" href="https://kiranpsankhi.com.np/tutorial-viewer.html">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <!-- zero-md engine -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/zero-md@3?register"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --header-bg: rgba(15, 23, 42, 0.88);
      --sidebar-w: 320px;
      --radius: 12px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    #read-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      z-index: 200;
      transition: width 0.1s linear;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      min-width: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: var(--transition);
      white-space: nowrap;
    }

    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .doc-meta { min-width: 0; }
    .doc-title {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .doc-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.1rem 0.5rem;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 4px;
      margin-top: 2px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition);
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .drawer-toggle { display: none; }

    .layout-container {
      max-width: 1560px;
      margin: 0 auto;
      display: flex;
      min-height: calc(100vh - 65px);
    }

    aside.toc-sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: sticky;
      top: 65px;
      height: calc(100vh - 65px);
      padding: 1.5rem 1rem 2rem 1.5rem;
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      background: var(--bg);
    }

    .toc-search {
      position: relative;
      width: 100%;
    }

    .toc-search input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.55rem 0.75rem 0.55rem 2.2rem;
      color: var(--text);
      font-size: 0.82rem;
      outline: none;
      transition: var(--transition);
    }

    .toc-search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .toc-search .material-icons {
      position: absolute;
      left: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .toc-list-wrap {
      overflow-y: auto;
      flex: 1;
      padding-right: 0.25rem;
    }

    .toc-list-wrap::-webkit-scrollbar { width: 5px; }
    .toc-list-wrap::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 3px;
    }

    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .toc-list a {
      display: block;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.81rem;
      line-height: 1.35;
      transition: var(--transition);
      border-left: 2px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toc-list a:hover {
      color: var(--accent);
      background: var(--accent-soft);
      border-left-color: var(--accent);
    }

    .toc-list a.toc-h3 {
      padding-left: 1.25rem;
      font-size: 0.78rem;
    }

    main.content-area {
      flex: 1;
      min-width: 0;
      padding: 2.5rem 3rem 5rem 3rem;
      max-width: 1040px;
      margin: 0 auto;
    }

    .loader-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 2rem;
      color: var(--text-muted);
      gap: 1rem;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(56, 189, 248, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 960px) {
      .drawer-toggle { display: inline-flex; }

      aside.toc-sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        height: 100vh;
        z-index: 300;
        background: #090e17;
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.6);
        transform: translateX(100%);
        transition: transform 0.25s ease;
      }

      aside.toc-sidebar.open {
        transform: translateX(0);
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        z-index: 250;
        display: none;
      }

      .drawer-backdrop.open { display: block; }
      main.content-area { padding: 1.5rem 1.25rem 4rem; }
    }
  </style>
</head>
<body>

  <div id="read-progress"></div>

  <header>
    <div class="nav-left">
      <a href="tutorials.html" class="back-btn">
        <span class="material-icons" style="font-size: 1.15rem;" aria-hidden="true">arrow_back</span>
        Tutorials
      </a>
      <div class="doc-meta">
        <h1 class="doc-title" id="page-guide-title">Loading tutorial...</h1>
        <span class="doc-badge" id="page-guide-category">Guide</span>
      </div>
    </div>
    <div class="nav-actions">
      <a href="index.html" class="icon-btn" title="Home" aria-label="Home">
        <span class="material-icons" style="font-size: 1.2rem;" aria-hidden="true">home</span>
      </a>
      <a id="view-raw-btn" href="#" target="_blank" rel="noopener noreferrer" class="icon-btn" title="View Raw Markdown" aria-label="View Raw Markdown">
        <span class="material-icons" style="font-size: 1.2rem;" aria-hidden="true">code</span>
      </a>
      <button class="icon-btn drawer-toggle" id="drawer-btn" title="Table of Contents" aria-label="Toggle Outline">
        <span class="material-icons" style="font-size: 1.2rem;" aria-hidden="true">menu_book</span>
      </button>
    </div>
  </header>

  <div class="drawer-backdrop" id="backdrop"></div>

  <div class="layout-container">
    <aside class="toc-sidebar" id="toc-sidebar">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">Table of Contents</span>
        <button class="icon-btn drawer-toggle" id="drawer-close" style="width: 28px; height: 28px;">
          <span class="material-icons" style="font-size: 1rem;">close</span>
        </button>
      </div>

      <div class="toc-search">
        <span class="material-icons">search</span>
        <input type="text" id="toc-filter" placeholder="Filter sections...">
      </div>

      <div class="toc-list-wrap">
        <ul class="toc-list" id="toc-items">
          <li style="color: var(--text-muted); font-size: 0.8rem; padding: 0.5rem 0;">Scanning sections...</li>
        </ul>
      </div>
    </aside>

    <main class="content-area">
      <div class="loader-placeholder" id="loader">
        <div class="spinner"></div>
        <p>Loading document and rendering markdown...</p>
      </div>

      <zero-md id="md-viewer" manual-render>
        <template>
          <style>
            :host {
              display: block;
              position: relative;
              font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
              color: #f1f5f9;
              line-height: 1.75;
            }
            h1, h2, h3, h4 { color: #f8fafc; font-weight: 700; scroll-margin-top: 80px; }
            h1 { font-size: 2.1rem; border-bottom: 1px solid #334155; padding-bottom: 0.6rem; margin: 2rem 0 1.2rem; }
            h2 { font-size: 1.5rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.4rem; margin: 2.2rem 0 1rem; color: #38bdf8; }
            h3 { font-size: 1.18rem; margin: 1.6rem 0 0.6rem; color: #cbd5e1; }
            p { margin: 1rem 0; color: #cbd5e1; font-size: 0.98rem; }
            a { color: #38bdf8; text-decoration: none; border-bottom: 1px dashed rgba(56, 189, 248, 0.4); }
            a:hover { border-bottom-color: #38bdf8; }
            pre {
              position: relative;
              background: #020617 !important;
              border: 1px solid #334155;
              border-radius: 8px;
              padding: 1.1rem !important;
              overflow-x: auto;
              margin: 1.2rem 0;
            }
            code {
              font-family: 'Fira Code', monospace;
              font-size: 0.88rem;
              color: #e2e8f0;
            }
            :not(pre) > code {
              background: #1e293b;
              color: #38bdf8;
              padding: 0.2rem 0.45rem;
              border-radius: 5px;
              font-size: 0.85em;
              border: 1px solid #334155;
            }
            .code-copy-btn {
              position: absolute;
              top: 8px;
              right: 8px;
              background: #1e293b;
              color: #94a3b8;
              border: 1px solid #334155;
              border-radius: 6px;
              padding: 4px 8px;
              font-size: 0.72rem;
              font-family: 'Inter', sans-serif;
              cursor: pointer;
              transition: all 0.2s ease;
              user-select: none;
            }
            .code-copy-btn:hover {
              color: #f8fafc;
              background: #334155;
            }
            blockquote {
              border-left: 4px solid #38bdf8;
              background: rgba(56, 189, 248, 0.07);
              padding: 0.8rem 1.2rem;
              border-radius: 0 8px 8px 0;
              margin: 1.2rem 0;
              color: #e2e8f0;
            }
            table {
              width: 100%;
              border-collapse: collapse;
              margin: 1.4rem 0;
              font-size: 0.88rem;
            }
            th, td {
              border: 1px solid #334155;
              padding: 0.65rem 0.9rem;
              text-align: left;
            }
            th { background: #1e293b; color: #f8fafc; font-weight: 600; }
            tr:nth-child(even) { background: rgba(30, 41, 59, 0.35); }
            hr { border: 0; height: 1px; background: #334155; margin: 2rem 0; }
          </style>
        </template>
      </zero-md>
    </main>
  </div>

  <script>
    // Complete registry of all tutorials
    const GUIDE_REGISTRY = {
      'linux-server': {
        title: 'Linux File Server Administration',
        category: 'Linux Server',
        file: 'tutorials/basic_terminal_guide.md'
      },
      'bookorbit': {
        title: 'Bookorbit Calibre & eBook Server Setup',
        category: 'Media & Self-Hosting',
        file: 'tutorials/bookorbit_setup.md'
      },
      'docker-install': {
        title: 'Docker & Docker Compose Installation',
        category: 'Containers & Docker',
        file: 'tutorials/docker_installation.md'
      },
      'server-backup': {
        title: 'Homelab Backup Strategies & Restic',
        category: 'Storage & Backups',
        file: 'tutorials/homeserver_backup.md'
      },
      'wildcard-ssl': {
        title: 'Wildcard HTTPS SSL Certificate Setup',
        category: 'Security & SSL',
        file: 'tutorials/https_wildcard_certificate.md'
      },
      'immich': {
        title: 'Immich Self-Hosted Photo & Video Management',
        category: 'Media & Self-Hosting',
        file: 'tutorials/immich_setup.md'
      },
      'jellyfin': {
        title: 'Jellyfin Media Server Deployment',
        category: 'Media & Streaming',
        file: 'tutorials/jellyfin_setup.md'
      },
      'metube': {
        title: 'MeTube Web GUI Downloader Setup',
        category: 'Self-Hosting Tools',
        file: 'tutorials/metube_setup.md'
      },
      'navidrome': {
        title: 'Navidrome Streaming Music Server',
        category: 'Media & Streaming',
        file: 'tutorials/navidrome_setup.md'
      },
      'portainer': {
        title: 'Portainer CE Web Management Setup',
        category: 'Containers & Docker',
        file: 'tutorials/portainer_setup.md'
      },
      'qbittorrent': {
        title: 'qBittorrent-nox Headless Setup',
        category: 'Self-Hosting Tools',
        file: 'tutorials/qbittorrent_setup.md'
      },
      'samba': {
        title: 'Samba SMB Network Share Setup',
        category: 'Storage & Backups',
        file: 'tutorials/samba_setup.md'
      },
      'seafile': {
        title: 'Seafile Private Cloud File Sync',
        category: 'Storage & Cloud',
        file: 'tutorials/seafile_setup.md'
      },
      'tailscale-adguard-nginx': {
        title: 'Tailscale, AdGuard Home & Nginx Proxy Manager',
        category: 'Networking & DNS',
        file: 'tutorials/tailscale_adguard_nginx.md'
      },
      'tailscale': {
        title: 'Tailscale Mesh VPN Configuration',
        category: 'Networking & VPN',
        file: 'tutorials/tailscale_setup.md'
      },
      'vaultwarden': {
        title: 'Vaultwarden Self-Hosted Password Vault',
        category: 'Security & Self-Hosting',
        file: 'tutorials/vaultwarden_setup.md'
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const guideKey = urlParams.get('guide') || 'linux-server';
    const directSrc = urlParams.get('src');

    let targetFile = 'tutorials/basic_terminal_guide.md';
    let targetTitle = 'Linux File Server Administration';
    let targetCategory = 'Linux Server';

    if (directSrc) {
      targetFile = directSrc;
      targetTitle = directSrc.split('/').pop().replace('.md', '').replace(/_/g, ' ');
      targetTitle = targetTitle.charAt(0).toUpperCase() + targetTitle.slice(1);
    } else if (GUIDE_REGISTRY[guideKey]) {
      targetFile = GUIDE_REGISTRY[guideKey].file;
      targetTitle = GUIDE_REGISTRY[guideKey].title;
      targetCategory = GUIDE_REGISTRY[guideKey].category;
    }

    document.getElementById('page-guide-title').textContent = targetTitle;
    document.getElementById('page-guide-category').textContent = targetCategory;
    document.title = `${targetTitle} | Tutorials`;
    document.getElementById('view-raw-btn').href = targetFile;

    const zeroMd = document.getElementById('md-viewer');
    zeroMd.setAttribute('src', targetFile);
    zeroMd.render();

    zeroMd.addEventListener('zero-md-rendered', () => {
      document.getElementById('loader').style.display = 'none';
      injectCodeCopyButtons();
      generateTableOfContents();
    });

    function injectCodeCopyButtons() {
      const root = zeroMd.shadowRoot;
      if (!root) return;
      const preBlocks = root.querySelectorAll('pre');

      preBlocks.forEach((pre) => {
        if (pre.querySelector('.code-copy-btn')) return;
        const btn = document.createElement('button');
        btn.className = 'code-copy-btn';
        btn.textContent = 'Copy';

        btn.addEventListener('click', async () => {
          const code = pre.querySelector('code');
          const text = code ? code.innerText : pre.innerText;
          try {
            await navigator.clipboard.writeText(text);
            btn.textContent = 'Copied!';
            btn.style.color = '#38bdf8';
            setTimeout(() => {
              btn.textContent = 'Copy';
              btn.style.color = '#94a3b8';
            }, 2000);
          } catch (err) {
            btn.textContent = 'Failed';
          }
        });

        pre.appendChild(btn);
      });
    }

    function generateTableOfContents() {
      const root = zeroMd.shadowRoot;
      if (!root) return;
      const headings = root.querySelectorAll('h2, h3');
      const tocList = document.getElementById('toc-items');
      tocList.innerHTML = '';

      if (headings.length === 0) {
        tocList.innerHTML = '<li style="color: var(--text-muted); font-size: 0.8rem; padding: 0.5rem 0;">No headings found in this document.</li>';
        return;
      }

      headings.forEach((h, idx) => {
        const id = h.id || `heading-${idx}`;
        h.id = id;

        const li = document.createElement('li');
        const link = document.createElement('a');
        link.href = `#${id}`;
        link.textContent = h.textContent.trim();
        link.title = h.textContent.trim();
        link.className = h.tagName.toLowerCase() === 'h3' ? 'toc-h3' : 'toc-h2';

        link.addEventListener('click', (e) => {
          e.preventDefault();
          h.scrollIntoView({ behavior: 'smooth', block: 'start' });
          if (window.innerWidth <= 960) toggleDrawer(false);
        });

        li.appendChild(link);
        tocList.appendChild(li);
      });
    }

    const tocFilter = document.getElementById('toc-filter');
    tocFilter.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const items = document.querySelectorAll('#toc-items li');
      items.forEach(li => {
        const text = li.textContent.toLowerCase();
        li.style.display = text.includes(q) ? 'block' : 'none';
      });
    });

    window.addEventListener('scroll', () => {
      const totalH = document.documentElement.scrollHeight - window.innerHeight;
      const pct = (window.scrollY / (totalH || 1)) * 100;
      document.getElementById('read-progress').style.width = `${Math.min(100, Math.max(0, pct))}%`;
    });

    const drawerBtn = document.getElementById('drawer-btn');
    const drawerClose = document.getElementById('drawer-close');
    const backdrop = document.getElementById('backdrop');
    const sidebar = document.getElementById('toc-sidebar');

    function toggleDrawer(open) {
      sidebar.classList.toggle('open', open);
      backdrop.classList.toggle('open', open);
    }

    drawerBtn.addEventListener('click', () => toggleDrawer(true));
    drawerClose.addEventListener('click', () => toggleDrawer(false));
    backdrop.addEventListener('click', () => toggleDrawer(false));
  </script>
</body>
</html>
