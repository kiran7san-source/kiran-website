<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorials - Kiran Prasad Sankhi</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Load the zero-md web component -->
    <script type="module" src="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js"></script>
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            color: #333;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background-color: #6200ea;
            color: white;
            padding: 24px;
            display: flex;
            align-items: center;
        }
        .header a {
            color: white;
            text-decoration: none;
            display: flex;
            margin-right: 16px;
        }
        .header h1 { margin: 0; font-size: 24px; font-weight: 500; }
        .content { padding: 32px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <a href="index.html" title="Back to Home"><span class="material-icons">arrow_back</span></a>
            <h1>Tutorials</h1>
        </div>
        <div class="content">
            <!-- This tag fetches and renders your markdown file -->
            <zero-md src="tutorials/basic_terminal_guide.md">
                <template>
                    <style>
                        /* Optional styling to match the Material theme */
                        h1, h2, h3 { font-family: 'Roboto', sans-serif; color: #6200ea; }
                        p, li { font-family: 'Roboto', sans-serif; line-height: 1.6; color: #333; }
                        code { background: #f5f5f5; padding: 2px 4px; border-radius: 4px; }
                    </style>
                </template>
            </zero-md>
        </div>
    </div>
</body>
</html>
